# This file extends the Astro docker-compose setup with additional services
# It will be automatically loaded by docker-compose when running astro dev start

services:
  # The monitoring DAG drives the API over HTTP rather than importing `api.*`:
  # Airflow 3 pins SQLAlchemy 1.4 while the API's models use the 2.0
  # declarative API, so an import would fail outright. It therefore needs the
  # internal API URL and the service-account credentials -- and no database URL
  # of its own, because it never touches the database directly.
  scheduler:
    volumes:
      - ./data:/usr/local/airflow/data
    environment:
      - MONITORING_API_URL=${MONITORING_API_URL:-http://api:8000}
      - MONITORING_SERVICE_EMAIL=${MONITORING_SERVICE_EMAIL:-monitoring-service@example.com}
      - MONITORING_SERVICE_PASSWORD=${MONITORING_SERVICE_PASSWORD:-}
      - MONITORING_WINDOW_DAYS=${MONITORING_WINDOW_DAYS:-28}
      - MONITORING_ACTUALS_LOOKBACK_DAYS=${MONITORING_ACTUALS_LOOKBACK_DAYS:-14}
      - MONITORING_SCHEDULE=${MONITORING_SCHEDULE:-@daily}
  dag-processor:
    volumes:
      - ./data:/usr/local/airflow/data
    environment:
      - MONITORING_SCHEDULE=${MONITORING_SCHEDULE:-@daily}
  triggerer:
    volumes:
      - ./data:/usr/local/airflow/data
  api-server:
    volumes:
      - ./data:/usr/local/airflow/data
    # Astro normally chooses a random localhost port for Airflow. Publish a
    # stable host port as well so the UI can always be opened directly from
    # OrbStack at http://localhost:8080.
    ports:
      - '${AIRFLOW_PORT:-8080}:8080'
    labels:
      dev.orbstack.domains: 'airflow.sales-forecasting.local@8080'
      com.sales-forecasting.url: 'https://airflow.sales-forecasting.local'

  # MLflow tracking server
  mlflow:
    image: python:3.11-slim
    platform: linux/arm64
    # SQLAlchemy is pinned below 2.0 because MLflow 2.9.2 imports
    # `FallbackAsyncAdaptedQueuePool`, a symbol that only exists in SQLAlchemy
    # 1.4; with SA 2.x the server crash-loops on startup as soon as a SQL
    # backend store is configured.
    #
    # IMPORTANT: every continuation line below must sit at the SAME indentation.
    # A more-indented line in a YAML folded block keeps its newline, and a bare
    # newline terminates a `bash -c` command: the server then started as just
    # `mlflow server --host 0.0.0.0 --port 5001`, silently dropping the backend
    # store, the artifact root and --serve-artifacts. MLflow consequently ran on
    # its default ephemeral /mlruns file store, so run history did not survive a
    # container recreate and nothing was written to Postgres or MinIO.
    command:
      - bash
      - -lc
      - >-
        pip install --no-cache-dir mlflow==2.9.2 "sqlalchemy<2" psycopg2-binary boto3 &&
        exec mlflow server --host 0.0.0.0 --port 5001
        --backend-store-uri postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
        --default-artifact-root s3://mlflow-artifacts/
        --serve-artifacts
    ports:
      - '5001:5001'
    labels:
      dev.orbstack.domains: 'mlflow.sales-forecasting.local@5001'
      com.sales-forecasting.url: 'https://mlflow.sales-forecasting.local'
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # The mlflow service runs python:3.11-slim, which has no curl, so the
      # probe uses the interpreter that is guaranteed to be present.
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"
      interval: 15s
      timeout: 10s
      retries: 20
      # Generous: this container installs MLflow at boot, which can take several
      # minutes on a cold pip cache. Too short a window marks it unhealthy
      # before the server has started and aborts the whole stack.
      start_period: 420s
    networks:
      - airflow
      - default
    restart: unless-stopped

  # PostgreSQL for MLflow
  mlflow-db:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'mlflow']
      interval: 5s
      retries: 5
    networks:
      - airflow
      - default
    restart: unless-stopped

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    platform: linux/arm64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    labels:
      # The console is the browser-facing MinIO surface; the S3 API remains
      # available on localhost:9000 for SDK clients.
      dev.orbstack.domains: 'minio.sales-forecasting.local@9001'
      com.sales-forecasting.url: 'https://minio.sales-forecasting.local'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - airflow
      - default
    restart: unless-stopped

  # Create MLflow bucket in MinIO
  minio-mc:
    image: minio/mc:latest
    platform: linux/arm64
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/mlflow-artifacts || true;
      mc anonymous set public myminio/mlflow-artifacts;
      exit 0;
      "

  # Add Redis to the Airflow network for Celery if needed
  redis:
    image: redis:7-alpine
    platform: linux/arm64
    expose:
      - 6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 30s
      retries: 50
    restart: unless-stopped

  # Streamlit UI for model inference
  streamlit-ui:
    image: python:3.11-slim
    platform: linux/arm64
    working_dir: /app
    # Dependency pins live in ui/entrypoint.sh, which is the single place they
    # are declared; installing them here as well would let the two drift.
    # The console is an API client now, so the heavy ML stack (mlflow, xgboost,
    # lightgbm, boto3) is no longer installed at all.
    command: ['bash', '-lc', 'chmod +x /app/entrypoint.sh && /app/entrypoint.sh']
    ports:
      - '8501:8501'
    labels:
      dev.orbstack.domains: 'streamlit.sales-forecasting.local@8501'
      com.sales-forecasting.url: 'https://streamlit.sales-forecasting.local'
    environment:
      # The ML Operations Console now reaches models through the API only. No
      # MLflow, MinIO, or AWS credentials are provided here, which is what
      # makes direct artifact access impossible rather than merely discouraged.
      - FORECAST_API_URL=http://api:8000
    volumes:
      - ./ui:/app
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # Probed with the interpreter, not curl: this service runs
      # python:3.11-slim, which has no curl. The previous `curl -fsS` probe
      # could only ever fail ("curl: not found"), so the container reported
      # unhealthy the whole time it was serving correctly.
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 30s
      timeout: 10s
      retries: 5
      # The console pip-installs its dependencies at boot.
      start_period: 180s
    networks:
      - airflow
      - default
    restart: unless-stopped

  # PostgreSQL for the Scenario Planner.
  # A separate database from MLflow's: scenario tables are application state
  # with their own lifecycle, and sharing MLflow's store would couple the two.
  scenario-db:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: ${SCENARIO_DB_USER:-scenario}
      POSTGRES_PASSWORD: ${SCENARIO_DB_PASSWORD:-scenario}
      POSTGRES_DB: ${SCENARIO_DB_NAME:-scenario}
    volumes:
      - scenario-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SCENARIO_DB_USER:-scenario}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow
      - default
    restart: unless-stopped

  # FastAPI serving layer: forecasts, model discovery, health, and metrics.
  #
  # Every model load and every prediction happens in this process. The browser
  # and the Streamlit console both reach models only through it, which is why
  # no MLflow or MinIO credential is given to either of them.
  api:
    # An explicit image tag, plus `pull_policy: build`.
    #
    # Without the tag, Compose derives one from the project name, which the
    # Astro CLI suffixes with a hash of `.env` -- so editing `.env` would change
    # the expected image name and `astro dev start` would fail with
    # "No such image". Without `pull_policy: build`, the CLI's `up` does not
    # build a service that has a `build:` section, so the first start fails for
    # the same reason. Together they make the image name stable and build it on
    # demand.
    image: ${API_IMAGE:-sales-forecasting-api:latest}
    pull_policy: build
    build:
      context: .
      dockerfile: api/Dockerfile
    platform: linux/arm64
    ports:
      # The API listens on container port 8000. This workspace publishes it on
      # 8010 because port 8000 is reserved for the Bite Sense project.
      - '${API_PORT:-8010}:8000'
    labels:
      dev.orbstack.domains: 'api.sales-forecasting.local@8000'
      com.sales-forecasting.url: 'https://api.sales-forecasting.local/docs'
    environment:
      # Service discovery, by Docker service name.
      - MLFLOW_TRACKING_URI=http://mlflow:5001
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_EXPERIMENT_NAME=sales_forecasting
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_DEFAULT_REGION=us-east-1
      - SCENARIO_DATABASE_URL=postgresql+psycopg2://${SCENARIO_DB_USER:-scenario}:${SCENARIO_DB_PASSWORD:-scenario}@scenario-db:5432/${SCENARIO_DB_NAME:-scenario}
      # --- Authentication -------------------------------------------------
      # REQUIRED. Without it the API cannot sign or verify a token and every
      # authenticated request fails. There is deliberately no generated
      # fallback: it would invalidate all sessions on each restart and make two
      # replicas reject each other's tokens.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY, e.g. `openssl rand -base64 48`}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-45}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - JWT_ISSUER=${JWT_ISSUER:-sales-forecasting-api}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-sales-forecasting}
      # Off for plain-HTTP local development; must be true behind HTTPS or the
      # refresh cookie is sent in the clear.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      # Open: new users sign up at /register. BUSINESS_USER can forecast and
      # run scenarios but cannot change models or users.
      - ALLOW_SELF_REGISTRATION=${ALLOW_SELF_REGISTRATION:-true}
      - SELF_REGISTRATION_ROLE=${SELF_REGISTRATION_ROLE:-BUSINESS_USER}
      # Roles the sign-up form lets a new user pick. ADMIN is left out on
      # purpose; add it only for a private demo.
      - SELF_REGISTRATION_ROLES=${SELF_REGISTRATION_ROLES:-VIEWER,BUSINESS_USER,ANALYST,ML_ENGINEER}
      - MAX_LOGIN_ATTEMPTS=${MAX_LOGIN_ATTEMPTS:-8}
      - LOGIN_LOCKOUT_MINUTES=${LOGIN_LOCKOUT_MINUTES:-15}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      # --- First-run admin bootstrap --------------------------------------
      # Runs only when the user table is empty. Leave the password unset and a
      # strong one is generated and written to the API log once.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-Platform Administrator}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # A browsable MLflow URL for the registry UI's run links. Distinct from
      # MLFLOW_TRACKING_URI, which is an internal hostname a browser cannot
      # resolve.
      - MLFLOW_PUBLIC_URL=${MLFLOW_PUBLIC_URL:-http://localhost:5001}
      # --- Monitoring -----------------------------------------------------
      - MONITORING_WINDOW_DAYS=${MONITORING_WINDOW_DAYS:-28}
      # The API creates this service account at start-up and the Airflow
      # scheduler signs in with it, so both must see the same value. Unset
      # means no account is created and the DAG fails with a clear message
      # rather than silently doing nothing.
      - MONITORING_SERVICE_EMAIL=${MONITORING_SERVICE_EMAIL:-monitoring-service@example.com}
      - MONITORING_SERVICE_PASSWORD=${MONITORING_SERVICE_PASSWORD:-}
      - MONITORING_SERVICE_NAME=${MONITORING_SERVICE_NAME:-Monitoring Service}
      # Where observed sales are read from, for the actuals ingestion step.
      - MONITORING_ACTUALS_PATH=${MONITORING_ACTUALS_PATH:-/usr/local/airflow/data/raw/kaggle_m5/v1.0.0/sales}
      # The M5 outcomes end on 2016-04-24, so windows are anchored at the latest
      # actual. Set to "today" for a live sales feed.
      - MONITORING_REFERENCE_DATE=${MONITORING_REFERENCE_DATE:-latest_actual}
      # --- Training workspace ---------------------------------------------
      # Uploaded training datasets: write-once objects in this MinIO bucket,
      # read by the Airflow workers through the same service name.
      - TRAINING_DATASET_BUCKET=${TRAINING_DATASET_BUCKET:-training-datasets}
      # Upload limits (see include/data_ingestion/limits.py for the rationale).
      # Whole request / any one file / files per upload / ZIP expansion.
      - TRAINING_UPLOAD_MAX_BYTES=${TRAINING_UPLOAD_MAX_BYTES:-209715200}
      - TRAINING_UPLOAD_MAX_FILE_BYTES=${TRAINING_UPLOAD_MAX_FILE_BYTES:-157286400}
      - TRAINING_UPLOAD_MAX_FILES=${TRAINING_UPLOAD_MAX_FILES:-10}
      - TRAINING_UPLOAD_MAX_EXPANDED_BYTES=${TRAINING_UPLOAD_MAX_EXPANDED_BYTES:-524288000}
      - TRAINING_UPLOAD_MAX_COMPRESSION_RATIO=${TRAINING_UPLOAD_MAX_COMPRESSION_RATIO:-100}
      - TRAINING_UPLOAD_MAX_ROWS=${TRAINING_UPLOAD_MAX_ROWS:-5000000}
      # Background processing: time budget, parallel jobs, inline threshold.
      - TRAINING_PROCESSING_TIMEOUT_SECONDS=${TRAINING_PROCESSING_TIMEOUT_SECONDS:-900}
      - TRAINING_MAX_CONCURRENT_JOBS=${TRAINING_MAX_CONCURRENT_JOBS:-2}
      - TRAINING_INLINE_PROCESSING_BYTES=${TRAINING_INLINE_PROCESSING_BYTES:-2097152}
      - TRAINING_PREVIEW_ROWS=${TRAINING_PREVIEW_ROWS:-20}
      # reject | allow (net-of-returns revenue)
      - TRAINING_NEGATIVE_SALES_POLICY=${TRAINING_NEGATIVE_SALES_POLICY:-reject}
      # Comma-separated store scope for training uploads; empty = any valid id.
      - TRAINING_ALLOWED_STORES=${TRAINING_ALLOWED_STORES:-}
      - TRAINING_ALLOWED_CURRENCIES=${TRAINING_ALLOWED_CURRENCIES:-USD}
      # Airflow 3 REST API, by service name inside the Astro network. The
      # credentials stay in the API; the browser never calls Airflow.
      - AIRFLOW_API_URL=${AIRFLOW_API_URL:-http://api-server:8080}
      - AIRFLOW_API_USERNAME=${AIRFLOW_API_USERNAME:-admin}
      - AIRFLOW_API_PASSWORD=${AIRFLOW_API_PASSWORD:-admin}
      # Browser link to a run, shown to ML engineers and admins only.
      - AIRFLOW_PUBLIC_URL=${AIRFLOW_PUBLIC_URL:-http://localhost:19382}
      - TRAINING_DAG_ID=${TRAINING_DAG_ID:-sales_forecast_training}
      # Model resolution
      - MLFLOW_REGISTERED_MODEL_PREFIX=${MLFLOW_REGISTERED_MODEL_PREFIX:-sales_forecast_models_}
      - FORECAST_MODELS=${FORECAST_MODELS:-ensemble,xgboost,lightgbm}
      - FORECAST_DEFAULT_MODEL=${FORECAST_DEFAULT_MODEL:-ensemble}
      - FORECAST_REQUIRE_PRODUCTION_STAGE=${FORECAST_REQUIRE_PRODUCTION_STAGE:-true}
      # Forecast bounds
      - FORECAST_MIN_HISTORY_DAYS=${FORECAST_MIN_HISTORY_DAYS:-30}
      - FORECAST_MAX_HORIZON_DAYS=${FORECAST_MAX_HORIZON_DAYS:-90}
      - FORECAST_PROFIT_TO_SALES_RATIO=${FORECAST_PROFIT_TO_SALES_RATIO:-0.3}
      # Browser origins allowed to call this API.
      - API_CORS_ALLOW_ORIGINS=${API_CORS_ALLOW_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      # Scenario Planner feature flags
      - SCENARIO_ENABLED_TYPES=${SCENARIO_ENABLED_TYPES:-promotion,traffic,closure,holiday,price,snap,custom}
      - BASELINE_REQUIRE_PRODUCTION_STAGE=${BASELINE_REQUIRE_PRODUCTION_STAGE:-true}
      - BASELINE_RESIDUAL_HORIZON_SCALING=${BASELINE_RESIDUAL_HORIZON_SCALING:-true}
      - BASELINE_FORECAST_TTL_HOURS=${BASELINE_FORECAST_TTL_HOURS:-24}
      - FEATURE_SCHEMA_ARTIFACT_PATH=${FEATURE_SCHEMA_ARTIFACT_PATH:-feature_schema.json}
      - DATASET_REGISTRY_PATH=/usr/local/airflow/data/raw
      - MODEL_CACHE_DIR=/app/.cache/models
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Read-only: the API reads dataset manifests for lineage, never writes.
      - ./data:/usr/local/airflow/data:ro
      # Downloaded model artifacts survive a restart, so the first forecast
      # after a redeploy does not re-fetch them from the object store.
      - api-model-cache:/app/.cache/models
    depends_on:
      scenario-db:
        condition: service_healthy
      mlflow:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - airflow
      - default
    restart: unless-stopped

  # Next.js web application: the Forecast Console and the Scenario Planner.
  #
  # Runs the dev server against a bind mount, which is what makes an edit on the
  # host show up without a rebuild. For a production image, build the app and
  # serve `next start` instead.
  frontend:
    image: node:22-alpine
    platform: linux/arm64
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - '${FRONTEND_PORT:-3001}:3000'
    labels:
      dev.orbstack.domains: 'sales-forecasting.local@3000'
      com.sales-forecasting.url: 'https://sales-forecasting.local'
    environment:
      # This is the URL the *browser* uses, so it must be reachable from the
      # host, not a Docker service name. It carries no credentials -- the API is
      # the only backend the browser ever talks to.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api
    networks:
      - airflow
      - default
    restart: unless-stopped

volumes:
  mlflow-db-volume:
  minio-data:
  scenario-db-volume:
  frontend-node-modules:
  api-model-cache:
